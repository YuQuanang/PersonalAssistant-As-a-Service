<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Assistant — Start</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236c4fcf'/><text y='.9em' font-size='60' x='50%' dominant-baseline='middle' text-anchor='middle'>🌿</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 20%, rgba(108,79,207,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 70% 80%, rgba(56,189,148,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      padding: 56px 48px 48px;
      width: min(480px, calc(100vw - 40px));
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 3.2rem;
      line-height: 1;
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f0f5;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 0.95rem;
      color: #8888a0;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    /* ── Start button ── */
    #start-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #6c4fcf, #4f8ecf);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(108,79,207,0.4);
    }
    #start-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(108,79,207,0.5);
    }
    #start-btn:active:not(:disabled) { transform: translateY(0); }
    #start-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ── Status area ── */
    #status {
      margin-top: 32px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #9999b8;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: #6c4fcf;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6c4fcf, #38bd94);
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s ease;
    }
    .progress-fill.indeterminate {
      width: 40% !important;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Success / error states */
    .status-row.success { color: #38bd94; }
    .status-row.error   { color: #e05c5c; }
    .status-icon { font-size: 1.1rem; }

    /* Manual fallback hint */
    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #55556a;
      line-height: 1.6;
    }
    .hint code {
      background: rgba(255,255,255,0.07);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">🌿</span>
    <h1>Personal Assistant</h1>
    <p class="tagline">Your calm, AI-powered helper for tasks,<br>calendar, and email — all in one place.</p>

    <button id="start-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Start
    </button>

    <div id="status"></div>
  </div>

  <script>
    const btn    = document.getElementById('start-btn');
    const status = document.getElementById('status');

    let pollTimer = null;
    let pollCount = 0;
    const POLL_INTERVAL_MS = 2000;  // 2 s between checks
    const MAX_POLLS = 45;           // 45 × 2 s = 90 s timeout

    function setStatus(html) {
      status.innerHTML = html;
    }

    function progressBar(indeterminate = true) {
      return `<div class="progress-track">
        <div class="progress-fill${indeterminate ? ' indeterminate' : ''}"></div>
      </div>`;
    }

    async function checkOllamaReady() {
      try {
        const r = await fetch('/api/ollama-status');
        const { ready } = await r.json();
        return ready;
      } catch {
        return false;
      }
    }

    function startPolling(interval = 2000) {
      pollTimer = setInterval(async () => {
        pollCount++;
        const ready = await checkOllamaReady();

        if (ready) {
          clearInterval(pollTimer);
          setStatus(`
            <div class="status-row success">
              <span class="status-icon">✅</span>
              <span>Ollama is ready — launching chat…</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:100%"></div>
            </div>
          `);
          setTimeout(() => { window.location.href = '/chat.html'; }, 800);
          return;
        }

        const elapsed = Math.round(pollCount * POLL_INTERVAL_MS / 1000);
        setStatus(`
          <div class="status-row">
            <div class="spinner"></div>
            <span>Waiting for Ollama… (${elapsed}s)</span>
          </div>
          ${progressBar()}
        `);

        if (pollCount >= MAX_POLLS) {
          clearInterval(pollTimer);
          btn.disabled = false;
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Retry`;
          setStatus(`
            <div class="status-row error">
              <span class="status-icon">⚠️</span>
              <span>Timed out waiting for Ollama (90s).</span>
            </div>
            <p class="hint">
              Try opening Ollama manually from your Applications folder,<br>
              or run <code>ollama serve</code> in a terminal, then click Retry.
            </p>
          `);
        }
      }, interval);
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;

      // First check if Ollama is already running
      const alreadyReady = await checkOllamaReady();
      if (alreadyReady) {
        setStatus(`
          <div class="status-row success">
            <span class="status-icon">✅</span>
            <span>Ollama already running — launching chat…</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:100%"></div>
          </div>
        `);
        setTimeout(() => { window.location.href = '/chat.html'; }, 700);
        return;
      }

      // Ask the server to open the Ollama app
      setStatus(`
        <div class="status-row">
          <div class="spinner"></div>
          <span>Launching Ollama…</span>
        </div>
        ${progressBar()}
      `);

      try {
        await fetch('/api/start-ollama', { method: 'POST' });
      } catch {
        // Non-fatal — still poll in case it started
      }

      setStatus(`
        <div class="status-row">
          <div class="spinner"></div>
          <span>Waiting for Ollama to be ready…</span>
        </div>
        ${progressBar()}
      `);

      pollCount = 0;
      startPolling(POLL_INTERVAL_MS);
    });
  </script>
</body>
</html>
